name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: secret-and-layout-scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for secrets, account data, and prohibited binaries
        shell: pwsh
        run: ./scripts/scan-secrets.ps1

  resume-script:
    name: resume-script-syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./scripts/parse-scripts.ps1

  dotnet:
    name: shared-dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore and test
        run: |
          dotnet restore TradeCopia.slnx
          dotnet test TradeCopia.slnx --nologo --no-restore
      - name: Confirm required docs exist
        run: |
          test -f docs/product/PRD.md
          test -f docs/architecture/SYSTEM-DESIGN.md
          test -f docs/agent/AUTONOMOUS-BUILD-MANDATE.md
          test -f docs/agent/STATE.md
          test -f LICENSE
          test -f AGENTS.md
